---
name: Application Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        os:
          [
            { name: "linux", image: "ubuntu-24.04", arch: "x64" },
            { name: "linux", image: "ubuntu-24.04-arm", arch: "arm64" },
            { name: "windows", image: "windows-2025", arch: "x64" },
            # Naming conflict can't publish windows arm. See #1183.
            # { name: "windows", image: "windows-11-arm", arch: "arm64" },
            { name: "macos", image: "macos-26-intel", arch: "x64" },
            { name: "macos", image: "macos-26", arch: "arm64" },
          ]

      fail-fast: true # Explicitly failing fast because this is a publish. We want to bail the entire release if something went wrong with another build

    runs-on: ${{ matrix.os.image }}

    steps:
      - name: Github checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Make (${{ matrix.os.arch }})
        env:
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY }}
        run: pnpm make --arch ${{ matrix.arch }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: out/make/**/*

      - name: Release From Make (${{ matrix.arch }})
        run: pnpm release:frommake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY }}
