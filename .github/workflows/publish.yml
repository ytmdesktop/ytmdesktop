---
name: Application Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to ref name)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi

  build:
    needs: prepare-release
    strategy:
      matrix:
        os:
          [
            { name: "linux", image: "ubuntu-24.04", arch: "x64" },
            { name: "linux", image: "ubuntu-24.04-arm", arch: "arm64" },
            { name: "windows", image: "windows-2025", arch: "x64" },
            # Naming conflict can't publish windows arm. See #1183.
            # { name: "windows", image: "windows-11-arm", arch: "arm64" },
            { name: "macos", image: "macos-26-intel", arch: "x64" },
            { name: "macos", image: "macos-26", arch: "arm64" },
          ]

      fail-fast: true

    runs-on: ${{ matrix.os.image }}

    steps:
      - name: Github checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Install libdbus
        if: matrix.os.name == 'linux'
        run: sudo apt-get install libdbus-1-dev pkg-config -y

      - name: Make (${{ matrix.os.arch }})
        env:
          YTMD_UPDATE_FEED_OWNER: ${{ github.repository_owner }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ github.event.repository.name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          NODE_ENV: production
        run: pnpm make --arch ${{ matrix.os.arch }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: out/make/**/*

      - name: Upload artifacts (${{ matrix.os.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os.name }}-${{ matrix.os.arch }}
          path: |
            out/make/squirrel.windows/${{ matrix.os.arch }}/*.exe
            out/make/deb/${{ matrix.os.arch }}/*.deb
            out/make/rpm/${{ matrix.os.arch }}/*.rpm
            out/make/zip/darwin/${{ matrix.os.arch }}/*.zip

      - name: Publish to fork GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET_ARCH: ${{ matrix.os.arch }}
        run: |
          shopt -s nullglob
          files=(
            out/make/squirrel.windows/${TARGET_ARCH}/*.exe
            out/make/squirrel.windows/${TARGET_ARCH}/*.nupkg
            out/make/squirrel.windows/${TARGET_ARCH}/RELEASES*
            out/make/deb/${TARGET_ARCH}/*.deb
            out/make/rpm/${TARGET_ARCH}/*.rpm
            out/make/zip/darwin/${TARGET_ARCH}/*.zip
          )
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          fi
