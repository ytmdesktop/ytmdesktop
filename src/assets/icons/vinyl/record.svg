<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="60%" stop-color="#111"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="sheen" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <mask id="center-hole-mask">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <!-- Center hole (transparent) -->
      <circle cx="512" cy="512" r="24" fill="black"/>
    </mask>
  </defs>

  <!-- Disc base -->
  <circle cx="512" cy="512" r="480" fill="url(#shadow)" mask="url(#center-hole-mask)"/>

  <!-- Grooves: concentric rings with low-opacity strokes -->
  <g opacity="0.2" stroke="#fff" stroke-opacity="0.08" fill="none">
    <!-- Use a dense but lightweight set of rings -->
    <!-- Outer to inner rings every 6px from r=470 down to r=80 -->
    <!-- This yields ~65 rings, visually smooth without being too heavy -->
    
